[build-system]
requires = ["setuptools>=42", "wheel", "toml"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "sam",
    "sam.data_sources",
    "sam.data_sources.weather",
    "sam.datasets",
    "sam.datasets.data",
    "sam.exploration",
    "sam.feature_engineering",
    "sam.logging_functions",
    "sam.metrics",
    "sam.models",
    "sam.preprocessing",
    "sam.utils",
    "sam.validation",
    "sam.visualization"
]

[project]
name = "sam"
version = "6.0.3"
description = "Time series anomaly detection and forecasting"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "Royal HaskoningDHV", email = "ruben.peters@rhdhv.com"}]
keywords = ["python", "data-science", "time-series", "forecasting", "anomaly-detection", "asset-management"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = ["pandas~=2.2", "numpy~=2.0", "scikit-learn~=1.5.2"]

[project.optional-dependencies]
data-science-common = [
    "keras>=3.0,<4",
    "cloudpickle",
    "onnx~=1.21.0",
    "onnxruntime~=1.19.2",
    "tf2onnx~=1.17.0",
    "nfft",
    "scipy~=1.13.1",
    "shap",
    "statsmodels"
]
tensorflow-cpu = ["sam[data-science-common]", "tensorflow>=2.17,<3"]
tensorflow-gpu = ["sam[data-science-common]", "tensorflow[and-cuda]>=2.17,<3"]
# Kept for backwards compatibility; equivalent to tensorflow-cpu.
data-science = ["sam[tensorflow-cpu]"]
# Minimal install for serving/inference with an already-exported ONNX model;
# no keras/tensorflow/training deps required. Includes "onnx" itself since
# load_parameters() runs onnx.checker.check_model() before loading.
prediction = ["onnx~=1.21.0", "onnxruntime~=1.19.2"]
plotting = ["matplotlib", "plotly", "seaborn"]
data-engineering = ["requests", "pymongo"]
all = [
    "sam[plotting]",
    "sam[data-engineering]",
    "sam[tensorflow-cpu]"
]
test = ["pytest<9", "pytest-cov", "pytest-mpl<=0.15.0", "fastparquet"]
docs = [
    "sphinx",
    "sphinx_rtd_theme",
    "numpydoc",
    "recommonmark",
    "readthedocs-sphinx-search",
    "sphinx-markdown-tables",
    "toml",
]

[project.urls]
homepage = "https://github.com/RoyalHaskoningDHV/sam"
issues = "https://github.com/RoyalHaskoningDHV/sam/issues"
discussions = "https://github.com/RoyalHaskoningDHV/sam/discussions"
documentation = "https://sam-rhdhv.readthedocs.io/en/latest/"

[tool.black]
line-length = 99
target-version = ['py312']

[tool.isort]
profile = "black"